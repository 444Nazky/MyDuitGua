# ... (bagian atas tetap sama)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0 # Pindahkan ke sini

# Bagian ini harus sejajar dengan dev_dependencies (di luar indentasi dev_dependencies)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "web/icons/app_icon.png" # Pastikan file ini ada di folder tersebut
  # Jika ingin mendukung Android modern (Adaptive Icons):
  adaptive_icon_background: "#FFFFFF" # Warna background (misal: putih)
  adaptive_icon_foreground: "web/icons/app_icon.png" # Gambar utama tanpa background

flutter:
  uses-material-design: true
  # Pastikan folder assets Anda didaftarkan jika ada gambar di dalam app
  assets:
    - web/icons/app_icon.png
